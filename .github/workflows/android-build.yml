# ==============================================================================
# Android Build & Sign Workflow
# ==============================================================================
# This workflow builds signed APK and AAB files for the Aqua Harmony Flutter app.
# It uses GitHub Secrets for all sensitive data and never exposes secrets in logs.
# ==============================================================================

name: Android Build & Sign

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.32.3'
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build Signed APK & AAB
    runs-on: ubuntu-latest
    
    steps:
      # ========================================
      # 1. Checkout Repository
      # ========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ========================================
      # 2. Set up Java JDK
      # ========================================
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      # ========================================
      # 3. Set up Flutter
      # ========================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # ========================================
      # 4. Verify Flutter Installation
      # ========================================
      - name: Verify Flutter Installation
        run: |
          flutter --version
          flutter doctor -v

      # ========================================
      # 5. Get Flutter Dependencies
      # ========================================
      - name: Get Flutter Dependencies
        run: flutter pub get

      # ========================================
      # 6. Decode Keystore from Secrets
      # ========================================
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Decode the base64-encoded keystore to a temporary file
          echo "$KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/release-keystore.jks
          
          # Verify the keystore was created (without exposing contents)
          if [ -f "$RUNNER_TEMP/release-keystore.jks" ]; then
            echo "✓ Keystore decoded successfully"
          else
            echo "✗ Failed to decode keystore"
            exit 1
          fi

      # ========================================
      # 7. Create key.properties file
      # ========================================
      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Create key.properties file for Gradle signing configuration
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/release-keystore.jks
          EOF
          
          # Remove leading whitespace from properties file
          sed -i 's/^[[:space:]]*//' android/key.properties
          
          echo "✓ key.properties created successfully"

      # ========================================
      # 8. Build Signed APK
      # ========================================
      - name: Build Signed APK
        run: |
          flutter build apk --release
          echo "✓ Signed APK built successfully"

      # ========================================
      # 9. Build Signed AAB (App Bundle)
      # ========================================
      - name: Build Signed AAB
        run: |
          flutter build appbundle --release
          echo "✓ Signed AAB built successfully"

      # ========================================
      # 10. Clean Up Sensitive Files
      # ========================================
      - name: Clean Up Sensitive Files
        if: always()
        run: |
          # Securely remove keystore and key.properties
          rm -f $RUNNER_TEMP/release-keystore.jks
          rm -f android/key.properties
          echo "✓ Sensitive files cleaned up"

      # ========================================
      # 11. Upload APK Artifact
      # ========================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aqua-harmony-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

      # ========================================
      # 12. Upload AAB Artifact
      # ========================================
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aqua-harmony-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      # ========================================
      # 13. Build Summary
      # ========================================
      - name: Build Summary
        run: |
          echo "## 🎮 Aqua Harmony Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| APK | ✅ Built |" >> $GITHUB_STEP_SUMMARY
          echo "| AAB | ✅ Built |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download artifacts from the Actions tab." >> $GITHUB_STEP_SUMMARY

